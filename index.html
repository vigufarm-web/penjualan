<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://laporankebun.vercel.app; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penjualan Kebun · VIGU</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header><div><span class="brand">VIGU</span> PT Vigu Farm Indonesia</div><a href="https://laporankebun.vercel.app/">Dashboard Laporan Kebun ↗</a></header>
  <main>
    <h1>Penjualan Kebun</h1>
    <p id="status" role="status" aria-live="polite">Memeriksa sesi…</p>
    <form id="login" class="panel login" hidden>
      <h2>Masuk</h2>
      <label>Nama pengguna <input name="username" autocomplete="username" required></label>
      <label>Kata sandi <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Masuk</button>
    </form>
    <section id="sales" class="panel" hidden>
      <div class="bar"><h2>Penjualan Pisang &amp; Padi</h2><button id="logout" class="secondary" type="button">Keluar</button></div>
      <p>Untuk revisi, pilih baris lama. Periksa nomor surat jalan sebelum menambah rincian.</p>
      <div class="bar">
        <label>Jenis data <select id="type"><option value="pisang_penjualan">Penjualan Pisang</option><option value="padi_penjualan">Penjualan Padi</option></select></label>
        <div class="bar"><button id="excel" type="button" class="secondary">Unduh Excel</button><button id="add" type="button">Tambah</button></div>
      </div>
      <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
      <div class="bar"><button id="prev" type="button" class="secondary">Sebelumnya</button><span id="range"></span><button id="next" type="button" class="secondary">Berikutnya</button></div>
    </section>
    <dialog id="editor">
      <form id="entry">
        <h2 id="title"></h2>
        <label>Tanggal <input name="tanggal" type="date" required></label>
        <div id="fields"></div>
        <label>Keterangan <textarea name="keterangan" rows="2"></textarea></label>
        <div id="warning" hidden><p id="warning-text" role="alert"></p><label><input id="warning-confirm" type="checkbox" style="width:auto"> Saya sudah memeriksa dan tetap ingin menyimpan rincian ini.</label></div>
        <p id="message" role="status"></p>
        <div class="bar"><button id="cancel" type="button" class="secondary">Batal</button><button id="save">Simpan</button></div>
      </form>
    </dialog>
  </main>
</body>
</html>
